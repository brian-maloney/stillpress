name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Nightly: long differential run of incremental vs full builds.
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}${{ matrix.multisite && ' / multisite' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.wp == 'trunk' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', wp: '6.6' }
          - { php: '7.4', wp: 'latest' }
          - { php: '8.1', wp: '6.8' }
          # forms: Contact Form 7 6.2 needs WordPress 7.1 and PHP 8.3.
          - { php: '8.3', wp: 'latest', lint: true, forms: true }
          - { php: '8.3', wp: 'latest', multisite: true }
          - { php: '8.4', wp: 'latest', forms: true }
          - { php: '8.5', wp: 'latest', forms: true }
          - { php: '8.5', wp: 'trunk' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure wp-env for this matrix cell
        # The multisite cell keeps wp-env single-site: the multisite PHPUnit config installs its own network, and a
        # multisite wp-env breaks the WordPress test-suite install.
        run: node bin/wp-env-override.js "${{ matrix.php }}" "${{ matrix.wp }}"
      - run: npm run env:start
      - run: npm run composer -- install --no-interaction --no-progress
      - if: ${{ matrix.lint }}
        run: npm run lint:php
      - if: ${{ matrix.lint }}
        name: Runtime dependency licences are GPL-compatible
        run: npm run check:licenses
      - if: ${{ matrix.lint }}
        name: Search and forms clients (Node)
        run: npm run test:js
      - name: Start the test SFTP and Git servers
        run: npm run sftp:start && npm run git:start
      - name: SFTP and Git tests must run, not skip
        run: |
          npx wp-env run tests-cli php -r 'exit( @fsockopen( "sftp.test", 22, $n, $s, 5 ) && @fsockopen( "git.test", 443, $n, $s, 5 ) ? 0 : 1 );'
      - run: npm run test:unit
      - run: npm run test:integration
      - if: ${{ matrix.forms }}
        name: Form adapters against Contact Form 7 and WPForms Lite
        run: npm run forms:plugins && npm run test:integration:forms
      - if: ${{ matrix.multisite }}
        run: npm run test:integration:multisite

  system:
    name: System tests (real builds over HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run env:start
      - run: npm run composer -- install --no-interaction --no-progress
      - name: System tests
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/stillpress -- env STILLPRESS_SYSTEM_TESTS=1 STILLPRESS_DIFF_ITERATIONS=${{ github.event_name == 'schedule' && '500' || '25' }} vendor/bin/phpunit -c phpunit-system.xml.dist

  e2e:
    name: Visual diff (${{ matrix.theme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [ block, classic, pagebuilder ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run env:start
      - run: npm run composer -- install --no-interaction --no-progress
      - run: npm run test:e2e
        env:
          THEMES: ${{ matrix.theme }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.theme }}
          path: |
            playwright-report
            test-results
