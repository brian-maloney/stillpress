# Test-only configuration. See README.md.
server {
	listen 443 ssl;
	server_name git.test;
	ssl_certificate /etc/git-test/cert.pem;
	ssl_certificate_key /etc/git-test/key.pem;
	client_max_body_size 200m;

	# Smart HTTP, push allowed for the authenticated user.
	location ~ ^/repos(/.*)$ {
		auth_basic "git";
		auth_basic_user_file /etc/git-test/htpasswd;
		include fastcgi_params;
		fastcgi_pass unix:/run/fcgiwrap.sock;
		fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
		fastcgi_param GIT_PROJECT_ROOT /srv/git;
		fastcgi_param GIT_HTTP_EXPORT_ALL "";
		fastcgi_param PATH_INFO $1;
		fastcgi_param REMOTE_USER $remote_user;
	}

	# Read-only helper for the tests: create repos, list branches, read files.
	location = /inspect {
		include fastcgi_params;
		fastcgi_pass unix:/run/fcgiwrap.sock;
		fastcgi_param SCRIPT_FILENAME /srv/inspect.sh;
	}
}
